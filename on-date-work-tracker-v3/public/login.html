<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · On-Date</title><link rel="stylesheet" href="/styles.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow)}.login .brand{padding:0 0 28px}.login h1{font:800 27px Manrope;margin:0 0 8px}.login p{color:var(--muted);font-size:13px;line-height:1.65}.login .field{margin:20px 0}.login button{width:100%;margin-top:9px}.login input{height:46px}.login .msg{min-height:20px;font-size:12px}.login .error{color:var(--red)}.login .success{color:var(--green)}
</style></head><body><main class="login"><a class="brand" href="/"><span class="brand-icon">✓</span><span>On-Date<small>PERSONAL WORKSPACE</small></span></a><h1 id="heading">Your work, clearly tracked.</h1><p id="subtitle">Sign in with your email. We'll send a one-time verification code — no password needed.</p><form id="form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com"></div><div class="field" id="codeWrap" hidden><label for="code">6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><button class="btn primary" id="submit" type="submit">Continue with email</button><button class="btn subtle" id="back" type="button" hidden>Use a different email</button></form><div id="passkey" hidden><p>Add a passkey to sign in next time with your fingerprint, face, or device screen lock.</p><button class="btn primary" id="addPasskey">Add a passkey</button><button class="btn subtle" id="skipPasskey">Not now</button></div><p class="msg" id="msg" role="status" aria-live="polite"></p></main>
<script>
(function(){const A=window.hatchable&&window.hatchable.auth,$=id=>document.getElementById(id);let step='email',hasPasskey=false;const next=(()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')&&!n.includes('\\')&&!/[\x00-\x1f\x7f]/.test(n)?n:'/';})();function say(t,err=false){$('msg').textContent=t||'';$('msg').className='msg '+(err?'error':'success')}function go(){location.replace(next)}function offer(){if(hasPasskey||!A.supportsPasskeys()||localStorage.getItem('od-passkey-declined')==='1'){go();return}$('form').hidden=true;$('passkey').hidden=false;$('heading').textContent="You're signed in";$('subtitle').textContent='Make your next sign-in faster and easier.'}
if(!A){say('Sign-in is unavailable. Refresh and try again.',true);$('submit').disabled=true;return}A.getSession().then(s=>{if(s&&s.user)go()}).catch(()=>{});
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;try{if(step==='email'){const email=$('email').value.trim();const r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{await A.signInWithPasskey({email});go();return}catch(_){}}step='code';$('codeWrap').hidden=false;$('email').readOnly=true;$('back').hidden=false;$('submit').textContent='Verify and sign in';$('subtitle').textContent='Enter the one-time code sent to '+email+'.';$('code').focus();say('Verification code sent.')}else{await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});offer()}}catch(err){say(err.message||'Could not sign in. Check the details and try again.',true)}finally{$('submit').disabled=false}});
$('back').onclick=()=>{step='email';$('email').readOnly=false;$('codeWrap').hidden=true;$('back').hidden=true;$('submit').textContent='Continue with email';$('subtitle').textContent="Sign in with your email. We'll send a one-time verification code — no password needed.";say('')};
$('addPasskey').onclick=async()=>{try{const r=await A.registerPasskey();if(!r)localStorage.setItem('od-passkey-declined','1');go()}catch(e){say(e.message||'Passkey could not be saved. You can continue without one.',true)}};$('skipPasskey').onclick=()=>{localStorage.setItem('od-passkey-declined','1');go()};
})();
</script></body></html>
