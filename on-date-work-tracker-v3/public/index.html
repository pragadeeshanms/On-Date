<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>On-Date — Work Tracker</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="#"><span class="brand-icon">✓</span><span>On-Date<small>PERSONAL WORKSPACE</small></span></a><div class="nav-label">WORKSPACE</div><nav id="nav"><button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button><button class="nav-item" data-page="history">▤ <span>Work History</span></button><button class="nav-item" data-page="calendar">▦ <span>Calendar</span></button><button class="nav-item" data-page="reports">◷ <span>Reports</span></button></nav><div class="side-bottom"><div class="mini-profile"><div class="avatar" id="avatar">P</div><div><b id="sideName">Praga</b><small id="sideRole">Personal workspace</small></div><button id="themeBtn" title="Toggle theme">◐</button></div><button class="nav-item" data-page="settings">⚙ <span>Profile & settings</span></button><div class="side-note">Small steps. Clear records.<br><b>Make every day count.</b></div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow" id="todayLabel">YOUR WORKSPACE</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><span class="live-date" id="clock"></span><button class="btn primary" id="addTop">＋ Add work</button><button class="icon-btn mobile-menu" id="menuBtn">☰</button></div></header><section id="content"></section><footer>ON-DATE <span>·</span> Your work, clearly tracked.</footer></main></div><div class="modal-backdrop" id="modalBackdrop"><section class="modal"><div class="modal-head"><div><div class="eyebrow">WORK LOG</div><h2 id="formTitle">Add new work</h2><p>Capture the details while they're fresh.</p></div><button class="icon-btn" id="closeModal">×</button></div><form id="workForm"><input type="hidden" id="editId"><div class="field full"><label for="title">Work title *</label><input id="title" maxlength="200" required placeholder="e.g. Website dashboard development"></div><div class="form-grid"><div class="field"><label for="work_date">Work date *</label><input type="date" id="work_date" required></div><div class="field"><label for="start_time">Start time</label><input type="time" id="start_time"></div><div class="field"><label for="end_time">End time</label><input type="time" id="end_time"></div></div><div class="time-hint" id="timeHint">Time spent will be calculated from start and end time.</div><div class="form-grid"><div class="field"><label for="category">Category</label><select id="category"><option>Development</option><option>Meeting</option><option>Learning</option><option>Research</option><option>Design</option><option>Testing</option><option>Documentation</option><option>Other</option></select></div><div class="field"><label for="status">Status</label><select id="status"><option>Not Started</option><option selected>In Progress</option><option>Completed</option><option>On Hold</option></select></div><div class="field"><label for="priority">Priority</label><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div></div><div class="field full"><label for="description">Work description</label><textarea id="description" rows="2" placeholder="What did you work on?"></textarea></div><div class="form-grid"><div class="field"><label for="project_name">Project name</label><input id="project_name" placeholder="Project or client"></div><div class="field"><label for="tags">Tags</label><input id="tags" placeholder="frontend, sprint-12"></div></div><div class="field full"><label for="technologies_used">Technologies used</label><input id="technologies_used" placeholder="React, Figma, PostgreSQL"></div><div class="form-grid"><div class="field"><label for="challenges_faced">Challenges faced</label><textarea id="challenges_faced" rows="2"></textarea></div><div class="field"><label for="solution_outcome">Solution or outcome</label><textarea id="solution_outcome" rows="2"></textarea></div></div><div class="field full"><label for="additional_notes">Additional notes</label><textarea id="additional_notes" rows="2"></textarea></div><div class="modal-actions"><button type="button" class="btn subtle" id="cancelModal">Cancel</button><button type="submit" class="btn primary">Save work</button></div></form></section></div><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
